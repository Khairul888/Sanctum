ollama:
  host: "http://ollama:11434"
  model: "llama3.2"
  embedding_model: "nomic-embed-text"
  vision_model: "qwen3-vl:4b"

chunking:
  chunk_size: 500
  overlap: 50

retrieval:
  n_results: 3

search:
  n_results: 3
  timeout_seconds: 10

agent:
  max_tool_rounds: 3

memory:
  db_path: "/app/data/memory.db"
  max_short_term_turns: 10

chromadb:
  host: "chromadb"
  port: 8000
  collection: "documents"

auth:
  api_key: ${API_KEY}
